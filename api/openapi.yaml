          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
  /api/v1/client/dislikes:
    delete:
      summary: Bring every passed profile back in the deck
      tags:
      - client
      operationId: delete_client_dislikes
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - restored
                properties:
                  restored:
                    type: integer
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-rt
  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    page_size:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  responses:
    '400':
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '401':
      description: Missing or invalid token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '403':
      description: Forbidden (role, password change required, CSRF)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '404':
      description: Not found or outside the actor's scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '409':
      description: Conflict / invalid state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '422':
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '429':
      description: Rate limited (Retry-After header)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
      required:
      - type
      - title
      - status
    Role:
      type: string
      enum:
      - ADMIN
      - MANAGER
      - PROFESSIONAL
      - CLIENT
    Visibility:
      type: string
      enum:
      - PUBLIC
      - CLIENTS
      - HIDDEN
    ContactType:
      type: string
      enum:
      - PHONE
      - WHATSAPP
      - TELEGRAM
      - INSTAGRAM
      - FACEBOOK
      - WEBSITE
      - OTHER
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - DELETED
        must_change_password:
          type: boolean
        recovery_codes_confirmed:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - username
      - role
      - status
      - must_change_password
      - recovery_codes_confirmed
      - created_at
      - last_login_at
    AdminUser:
      allOf:
      - $ref: '#/components/schemas/User'
      - type: object
        properties:
          status_reason:
            type: string
            nullable: true
          failed_login_count:
            type: integer
          locked_until:
            type: string
            format: date-time
            nullable: true
          deleted_at:
            type: string
            format: date-time
            nullable: true
        required:
        - status_reason
        - failed_login_count
        - locked_until
        - deleted_at
    AuthResponse:
      type: object
