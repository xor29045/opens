# Contract of the API — source of truth for the frontend types (openapi-typescript).
openapi: 3.0.3
info:
  title: Opensex platform API
  version: 1.0.0
  description: 'Contract of the backend (dossier de conception v2.2, §11). Errors use RFC 9457 Problem Details. Access tokens (EdDSA JWT, 10 min,
    5 min for admins) go in `Authorization: Bearer`; the refresh token is the `__Host-rt` HttpOnly cookie. Pagination: `page`, `page_size` (max
    50).'
servers:
- url: https://localhost
tags:
- name: health
- name: auth
- name: catalog
- name: manager
- name: professional
- name: billing
- name: client
- name: admin
- name: webhooks
paths:
  /healthz:
    get:
      summary: Liveness
      tags:
      - health
      operationId: get__healthz
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /readyz:
    get:
      summary: Readiness (database, Redis) — internal network only
      tags:
      - health
      operationId: get__readyz
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  database:
                    type: string
                  redis:
                    type: string
        '503':
          description: Not ready
  /api/v1/docs:
    get:
      summary: Swagger UI (development / staging only)
      tags:
      - health
      operationId: get_docs
      security: []
      responses:
        '200':
          description: OK
  /api/v1/docs/openapi.yaml:
    get:
      summary: This document (development / staging only)
      tags:
      - health
      operationId: get_docs_openapi.yaml
      security: []
      responses:
        '200':
          description: OK
  /api/v1/auth/register/client:
    post:
      summary: Register a CLIENT (role fixed by the endpoint, RM-01)
      tags:
      - auth
      operationId: post_auth_register_client
      description: Sets the `__Host-rt` refresh cookie. A `role` field is ignored and recorded as a security event.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  pattern: ^[a-zA-Z0-9_.-]{3,30}$
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
                accept_terms:
                  type: boolean
              required:
              - username
              - password
              - accept_terms
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/400'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
  /api/v1/auth/register/manager:
    post:
      summary: Register a MANAGER and its empty DRAFT establishment
      tags:
      - auth
      operationId: post_auth_register_manager
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  pattern: ^[a-zA-Z0-9_.-]{3,30}$
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
                accept_terms:
                  type: boolean
                accept_cgv:
                  type: boolean
                accept_dpa:
                  type: boolean
              required:
              - username
              - password
              - accept_terms
              - accept_cgv
              - accept_dpa
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/400'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
  /api/v1/auth/register/professional:
    post:
      summary: Register a PROFESSIONAL attached to a house (profile PENDING_APPROVAL)
      tags:
      - auth
      operationId: post_auth_register_professional
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  pattern: ^[a-zA-Z0-9_.-]{3,30}$
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
                accept_terms:
                  type: boolean
                establishment_slug:
                  type: string
                display_name:
                  type: string
                  maxLength: 60
              required:
              - username
              - password
              - accept_terms
              - establishment_slug
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/400'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
  /api/v1/auth/register/establishments:
    get:
      summary: Houses selectable at professional registration
      tags:
      - auth
      operationId: get_auth_register_establishments
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SelectableEstablishment'
                required:
                - items
        '429':
          $ref: '#/components/responses/429'
  /api/v1/auth/login:
    post:
      summary: Login (non-admin accounts)
      tags:
      - auth
      operationId: post_auth_login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
              - username
              - password
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
  /api/v1/auth/admin/login:
    post:
      summary: Admin login (short tokens, IP allowlist)
      tags:
      - auth
      operationId: post_auth_admin_login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
              - username
              - password
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
  /api/v1/auth/refresh:
    post:
      summary: Rotate the refresh token
      tags:
      - auth
      operationId: post_auth_refresh
      description: 'CSRF protection: allowed `Origin` and `X-Requested-With` header required. Reusing a rotated token revokes the session family.'
      security:
      - refreshCookie: []
      parameters:
      - name: X-Requested-With
        in: header
        required: true
        schema:
          type: string
          enum:
          - XMLHttpRequest
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
  /api/v1/auth/logout:
    post:
      summary: Revoke the current session
      tags:
      - auth
      operationId: post_auth_logout
      security:
      - refreshCookie: []
      - bearerAuth: []
      parameters:
      - name: X-Requested-With
        in: header
        required: true
        schema:
          type: string
          enum:
          - XMLHttpRequest
      responses:
        '204':
          description: No Content
        '403':
          $ref: '#/components/responses/403'
  /api/v1/auth/logout-all:
    post:
      summary: Revoke every session
      tags:
      - auth
      operationId: post_auth_logout_all
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /api/v1/auth/me:
    get:
      summary: Current identity (allowed while must_change_password)
      tags:
      - auth
      operationId: get_auth_me
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /api/v1/auth/password:
    put:
      summary: Change password (current password required; other sessions revoked)
      tags:
      - auth
      operationId: put_auth_password
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 128
              required:
              - current_password
              - new_password
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
  /api/v1/auth/password/recover:
    post:
      summary: Reset the password with a recovery code
      tags:
      - auth
      operationId: post_auth_password_recover
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                recovery_code:
                  type: string
                new_password:
                  type: string
              required:
              - username
              - recovery_code
              - new_password
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/401'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
  /api/v1/auth/recovery-codes/confirm:
    post:
      summary: Confirm the recovery codes were saved
      tags:
      - auth
      operationId: post_auth_recovery_codes_confirm
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /api/v1/auth/recovery-codes/status:
    get:
      summary: Remaining recovery codes
      tags:
      - auth
      operationId: get_auth_recovery_codes_status
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryStatus'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /api/v1/auth/recovery-codes/regenerate:
    post:
      summary: New set of recovery codes (password required)
      tags:
      - auth
      operationId: post_auth_recovery_codes_regenerate
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
              required:
              - password
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
  /api/v1/auth/sessions:
    get:
      summary: Active sessions
      tags:
      - auth
      operationId: get_auth_sessions
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                required:
                - items
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /api/v1/auth/sessions/{id}:
    delete:
      summary: Revoke one of the actor's sessions
      tags:
      - auth
      operationId: delete_auth_sessions_id
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
  /api/v1/profiles:
    get:
      summary: Search published profiles
      tags:
      - catalog
      operationId: get_profiles
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/page_size'
      - name: region
        in: query
        required: false
        schema:
          type: string
      - name: city
        in: query
        required: false
        schema:
          type: string
      - name: establishment
        in: query
        required: false
        schema:
          type: string
      - name: categories
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Category slugs (any)
      - name: age_min
        in: query
        required: false
        schema:
          type: integer
          minimum: 18
          maximum: 99
      - name: age_max
        in: query
        required: false
        schema:
          type: integer
          minimum: 18
          maximum: 99
      - name: price_min
        in: query
        required: false
        schema:
          type: integer
          description: EUR
      - name: price_max
        in: query
        required: false
        schema:
          type: integer
          description: EUR
      - name: height_min
        in: query
        required: false
        schema:
          type: integer
      - name: height_max
        in: query
        required: false
        schema:
          type: integer
      - name: hair_color
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: eye_color
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: body_type
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: languages
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - recent
          - price_asc
          - price_desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageProfileCard'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
  /api/v1/profiles/{slug}:
    get:
      summary: Published profile (contacts filtered by visibility, RM-40)
      tags:
      - catalog
      operationId: get_profiles_slug
      security:
      - {}
      - bearerAuth: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
  /api/v1/establishments/{slug}:
    get:
      summary: Public page of a verified establishment
      tags:
      - catalog
      operationId: get_establishments_slug
      security:
      - {}
      - bearerAuth: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEstablishment'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
  /api/v1/regions:
    get:
      summary: Active regions and cities
      tags:
      - catalog
      operationId: get_regions
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Region'
                required:
                - items
        '429':
          $ref: '#/components/responses/429'
  /api/v1/categories:
    get:
      summary: Active categories
      tags:
      - catalog
      operationId: get_categories
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                required:
                - items
        '429':
          $ref: '#/components/responses/429'
  /api/v1/attributes:
    get:
      summary: Enumerations for filters and forms
      tags:
      - catalog
      operationId: get_attributes
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attributes'
        '429':
          $ref: '#/components/responses/429'
  /api/v1/billing/plans:
    get:
      summary: Active subscription plans
      tags:
      - billing
      operationId: get_billing_plans
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plan'
                required:
                - items
        '429':
          $ref: '#/components/responses/429'
  /api/v1/manager/establishment:
    get:
      summary: Own establishment (all fields and contacts)
      tags:
      - manager
      operationId: get_manager_establishment
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Establishment'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
    put:
      summary: Update the establishment
      tags:
      - manager
      operationId: put_manager_establishment
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstablishmentInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Establishment'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '409':
          $ref: '#/components/responses/409'
  /api/v1/manager/establishment/contacts:
    put:
      summary: Replace establishment contacts
      tags:
      - manager
      operationId: put_manager_establishment_contacts
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contacts:
                  type: array
                  items:
                    $ref: '#/components/schemas/ContactInput'
              required:
              - contacts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
                required:
                - items
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
  /api/v1/manager/publication-status:
    get:
      summary: 'Overview: checklist and state of every profile'
      tags:
      - manager
      operationId: get_manager_publication_status
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerOverview'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
  /api/v1/manager/stats:
    get:
      summary: Aggregated views per profile (subscription required)
      tags:
      - manager
      operationId: get_manager_stats
      security:
      - bearerAuth: []
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 90
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentStats'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
  /api/v1/manager/pending:
    get:
      summary: Pending registrations (PENDING_APPROVAL)
      tags:
      - manager
      operationId: get_manager_pending
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/page_size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageProfileSummary'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
